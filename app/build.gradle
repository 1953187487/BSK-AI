plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.floatai'
    compileSdk 34

    defaultConfig {
        applicationId "com.floatai.ui"
        minSdk 26
        targetSdk 34
        versionCode 11
        versionName "1.0.5"

        // 协议版本号：v1.0.5 起固定为 5，不再随版本升级强制重签。
        // 用户已签过 v5 协议后，升级不会再走协议页（除非未来手动修改此处）。
        buildConfigField "int", "PROTOCOL_VERSION", "5"
    }

    signingConfigs {
        release {
            storeFile file(System.getenv("FLOATAI_KEYSTORE") ?: "${System.getProperty("user.home")}/floatai-release.keystore")
            storePassword System.getenv("FLOATAI_KEYSTORE_PASSWORD") ?: "floatai2026"
            keyAlias "floatai"
            keyPassword System.getenv("FLOATAI_KEY_PASSWORD") ?: "floatai2026"
        }
    }

    buildTypes {
        release {
            // 完整版：不做 R8 压缩/混淆，保留完整代码与资源
            minifyEnabled false
            shrinkResources false
            signingConfig signingConfigs.release
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            minifyEnabled false
            shrinkResources false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        compose true
        buildConfig true
    }

    composeOptions {
        kotlinCompilerExtensionVersion = '1.5.10'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.activity:activity-compose:1.8.2'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.7.0'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.7.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.7.0'
    implementation 'androidx.navigation:navigation-compose:2.7.7'

    def composeBom = platform('androidx.compose:compose-bom:2024.02.00')
    implementation composeBom
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-extended'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    debugImplementation 'androidx.compose.ui:ui-tooling'

    implementation 'androidx.core:core-splashscreen:1.0.1'
    implementation 'org.json:json:20231013'

    // MCP server：本地 HTTP JSON-RPC
    implementation 'org.nanohttpd:nanohttpd:2.3.1'
}
