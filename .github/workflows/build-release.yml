name: Build and Release AURA v2.0 Beta

on:
  push:
    tags:
      - 'v2.*'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  build:
    name: Build AURA APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 11076708

      - name: Grant execute permission
        run: chmod +x ./gradlew

      # 如果有签名密钥，解码并使用；否则构建时使用自动签名
      - name: Prepare signing
        run: |
          if [ -n "$BSK_KEYSTORE_B64" ]; then
            echo "$BSK_KEYSTORE_B64" | base64 -d > bsk-release.keystore
            echo "SIGNING=true" >> $GITHUB_ENV
          else
            echo "No signing keystore, using auto-signing"
            echo "SIGNING=false" >> $GITHUB_ENV
          fi
        env:
          BSK_KEYSTORE_B64: ${{ secrets.BSK_KEYSTORE_B64 }}

      - name: Build Debug APK
        run: |
          if [ "$SIGNING" = "true" ]; then
            ./gradlew assembleDebug \
              -Pandroid.injected.signing.store.file=bsk-release.keystore \
              -Pandroid.injected.signing.store.password=${{ secrets.BSK_KEYSTORE_PASSWORD }} \
              -Pandroid.injected.signing.key.alias=aura \
              -Pandroid.injected.signing.key.password=${{ secrets.BSK_KEY_PASSWORD }}
          else
            ./gradlew assembleDebug
          fi

      - name: Build Release APK
        if: env.SIGNING == 'true'
        run: |
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file=bsk-release.keystore \
            -Pandroid.injected.signing.store.password=${{ secrets.BSK_KEYSTORE_PASSWORD }} \
            -Pandroid.injected.signing.key.alias=aura \
            -Pandroid.injected.signing.key.password=${{ secrets.BSK_KEY_PASSWORD }}

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: AURA-debug
          path: app/build/outputs/apk/debug/*.apk

      - name: Upload Release APK
        if: env.SIGNING == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: AURA-release
          path: app/build/outputs/apk/release/*.apk

      - name: Get version
        id: version
        run: |
          VERSION=$(grep 'versionName' app/build.gradle | head -1 | sed 's/.*"\(.*\)".*/\1/')
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: AURA v${{ steps.version.outputs.version }} 正式版
          body: |
            ## AURA v${{ steps.version.outputs.version }} 正式版

            ### 本版本亮点
            - 底部横向导航：移除顶部导航栏，「AI 聊天 / 设置」移至底部玻璃导航
            - 全新引导流程：移除旧的进入弹层核验，Shizuku(Dhizuku) 可授权，重写"已进入"版本更新引导
            - 本地模型刷新：已下载本地模型自动重新扫描并显示在模型列表
            - 终端权限门控：终端在 Shizuku(Dhizuku) 授予 root 级权限前保持锁定，授权后以 root 级可用
            - 设置界面背景重写；「开发工具」与「IDE」依赖下载合并为统一入口并修复安装失败
            - 双模型视频生成：已配置的 API/自定义模型写分镜脚本，本地模型生成视频
            - 集成 AndroidLiquidGlass（Kyant0，Apache-2.0）液态玻璃效果，2.1.1 标注致谢
            - 协议精简：仅保留《开源软件许可协议》与《用户须知》，系统公告并入《用户须知》
            - 二改归属：README / NOTICE / CONTRIBUTING 保留原作者署名与原仓库链接

            ### 安装说明
            1. 下载下方 APK 文件
            2. 安装到手机（允许未知来源）
            3. 首次启动完成 API 配置 / Shizuku(Dhizuku) 授权 / 协议 三步引导
            4. 开始与 AURA 对话

            ### 致谢
            - AndroidLiquidGlass：https://github.com/Kyant0/AndroidLiquidGlass（Apache-2.0）

            ### 原作者
            - 原作者主页：https://github.com/1953187487
            - 原仓库：https://github.com/1953187487/BSK-AI
          files: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
