name: Build and Release AURA v2.0 Beta

on:
  push:
    tags:
      - 'v2.*'
  workflow_dispatch:

jobs:
  build:
    name: Build AURA APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 11076708

      - name: Grant execute permission
        run: chmod +x ./gradlew

      # 如果有签名密钥，解码并使用；否则构建时使用自动签名
      - name: Prepare signing
        run: |
          if [ -n "$BSK_KEYSTORE_B64" ]; then
            echo "$BSK_KEYSTORE_B64" | base64 -d > bsk-release.keystore
            echo "SIGNING=true" >> $GITHUB_ENV
          else
            echo "No signing keystore, using auto-signing"
            echo "SIGNING=false" >> $GITHUB_ENV
          fi
        env:
          BSK_KEYSTORE_B64: ${{ secrets.BSK_KEYSTORE_B64 }}

      - name: Build Debug APK
        run: |
          if [ "$SIGNING" = "true" ]; then
            ./gradlew assembleDebug \
              -Pandroid.injected.signing.store.file=bsk-release.keystore \
              -Pandroid.injected.signing.store.password=${{ secrets.BSK_KEYSTORE_PASSWORD }} \
              -Pandroid.injected.signing.key.alias=aura \
              -Pandroid.injected.signing.key.password=${{ secrets.BSK_KEY_PASSWORD }}
          else
            ./gradlew assembleDebug
          fi

      - name: Build Release APK
        if: env.SIGNING == 'true'
        run: |
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file=bsk-release.keystore \
            -Pandroid.injected.signing.store.password=${{ secrets.BSK_KEYSTORE_PASSWORD }} \
            -Pandroid.injected.signing.key.alias=aura \
            -Pandroid.injected.signing.key.password=${{ secrets.BSK_KEY_PASSWORD }}

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: AURA-debug
          path: app/build/outputs/apk/debug/*.apk

      - name: Upload Release APK
        if: env.SIGNING == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: AURA-release
          path: app/build/outputs/apk/release/*.apk

      - name: Get version
        id: version
        run: |
          VERSION=$(grep 'versionName' app/build.gradle | head -1 | sed 's/.*"\(.*\)".*/\1/')
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: AURA v${{ steps.version.outputs.version }} 正式版
          body: |
            ## AURA v${{ steps.version.outputs.version }} 正式版

            ### 本版本亮点
            - 全链路液态玻璃 UI 重写：自研 Liquid Glass 组件库（玻璃面板 / 胶囊导航 / 分段控件 / 玻璃气泡 / 玻璃按钮 / 玻璃输入框）
            - 全新顶部小导航栏：仅「AI 聊天 / 设置」两入口，终端与 IDE 集成至顶部子导航（对话 / 终端 / IDE）
            - 聊天界面接入 AgentEngine 真实流式对话，工具调用过程可视化
            - 终端 / IDE 界面全面换装液态玻璃
            - 协议精简：仅保留《开源软件许可协议》与《用户须知》，系统公告并入《用户须知》
            - 二改归属：README / NOTICE / CONTRIBUTING 保留原作者署名与原仓库链接

            ### 安装说明
            1. 下载下方 APK 文件
            2. 安装到手机（允许未知来源）
            3. 首次启动完成语言 / API / 权限 / 协议 四步引导
            4. 开始与 AURA 对话

            ### 原作者
            - 原作者主页：https://github.com/1953187487
            - 原仓库：https://github.com/1953187487/BSK-AI
          files: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
