name: Build and Release AURA v2.0 Beta

on:
  push:
    tags:
      - 'v2.0.*'
  workflow_dispatch:

jobs:
  build:
    name: Build AURA APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 11076708

      - name: Grant execute permission
        run: chmod +x ./gradlew

      # 如果有签名密钥，解码并使用；否则使用自动签名
      - name: Prepare signing
        run: |
          if [ -n "$BSK_KEYSTORE_B64" ]; then
            echo "$BSK_KEYSTORE_B64" | base64 -d > bsk-release.keystore
            echo "Signing keystore prepared"
          else
            echo "No signing keystore found, using auto-signing for debug build"
          fi
        env:
          BSK_KEYSTORE_B64: ${{ secrets.BSK_KEYSTORE_B64 }}

      - name: Build Debug APK (auto-signed)
        run: ./gradlew assembleDebug
        env:
          BSK_KEYSTORE: "${{ github.workspace }}/bsk-release.keystore"
          BSK_KEYSTORE_PASSWORD: "${{ secrets.BSK_KEYSTORE_PASSWORD }}"
          BSK_KEY_PASSWORD: "${{ secrets.BSK_KEY_PASSWORD }}"

      - name: Build Release APK
        if: secrets.BSK_KEYSTORE_B64 != ''
        run: ./gradlew assembleRelease
        env:
          BSK_KEYSTORE: "${{ github.workspace }}/bsk-release.keystore"
          BSK_KEYSTORE_PASSWORD: "${{ secrets.BSK_KEYSTORE_PASSWORD }}"
          BSK_KEY_PASSWORD: "${{ secrets.BSK_KEY_PASSWORD }}"

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: AURA-debug
          path: app/build/outputs/apk/debug/*.apk

      - name: Upload Release APK
        if: secrets.BSK_KEYSTORE_B64 != ''
        uses: actions/upload-artifact@v4
        with:
          name: AURA-release
          path: app/build/outputs/apk/release/*.apk

      - name: Get version
        id: version
        run: |
          VERSION=$(grep 'versionName' app/build.gradle | head -1 | sed 's/.*"\(.*\)".*/\1/')
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Create GitHub Release (Debug)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: AURA v${{ steps.version.outputs.version }} 预测试版
          body: |
            ## AURA v${{ steps.version.outputs.version }} 预测试版

            ### 核心功能
            - 实时后台语音监听服务（前台通知持续运行）
            - 中文语音指令意图识别引擎
            - 文件管理：移动/复制/删除/搜索手机文件
            - 媒体控制：播放/暂停/下一首/音量调节
            - 系统设置切换：蓝牙/WiFi/手电筒/飞行模式等
            - 无障碍服务辅助屏幕操作
            - 开机自启 + 自动更新检查
            - 全新深色紫蓝渐变 UI（Material 3）

            ### 安装说明
            1. 下载下方 APK 文件
            2. 安装到手机（允许未知来源）
            3. 首次启动授予录音、存储、通知等权限
            4. 点击麦克风按钮开始语音对话

            ### 支持的语音指令
            - "播放音乐" / "停止播放" / "下一首" / "音量调到50%"
            - "移动XX到XX" / "复制XX到XX" / "删除XX"
            - "打开微信" / "打开设置"
            - "打开蓝牙" / "关闭WiFi" / "打开手电筒"
            - "打电话给张三" / "发信息给李四说你好"
            - "截个图" / "现在几点了" / "今天几号"
          files: |
            app/build/outputs/apk/debug/*.apk
          prerelease: true
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
