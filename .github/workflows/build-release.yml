name: Build and Release AURA v2.0 Beta

on:
  push:
    tags:
      - 'v2.0.*'
  workflow_dispatch:

jobs:
  build:
    name: Build AURA APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 11076708

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Decode signing keystore
        run: |
          echo "$BSK_KEYSTORE_B64" | base64 -d > bsk-release.keystore
        env:
          BSK_KEYSTORE_B64: ${{ secrets.BSK_KEYSTORE_B64 }}

      - name: Build Debug APK
        run: ./gradlew assembleDebug
        env:
          BSK_KEYSTORE: "${{ github.workspace }}/bsk-release.keystore"
          BSK_KEYSTORE_PASSWORD: "${{ secrets.BSK_KEYSTORE_PASSWORD }}"
          BSK_KEY_PASSWORD: "${{ secrets.BSK_KEY_PASSWORD }}"

      - name: Build Release APK
        run: ./gradlew assembleRelease
        env:
          BSK_KEYSTORE: "${{ github.workspace }}/bsk-release.keystore"
          BSK_KEYSTORE_PASSWORD: "${{ secrets.BSK_KEYSTORE_PASSWORD }}"
          BSK_KEY_PASSWORD: "${{ secrets.BSK_KEY_PASSWORD }}"

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: AURA-debug
          path: app/build/outputs/apk/debug/*.apk

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: AURA-release
          path: app/build/outputs/apk/release/*.apk

      - name: Get version
        id: version
        run: |
          VERSION=$(grep 'versionName' app/build.gradle | head -1 | sed 's/.*"\(.*\)".*/\1/')
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: AURA v${{ steps.version.outputs.version }}
          body: |
            ## AURA v${{ steps.version.outputs.version }} 预测试版

            ### 新增功能
            - 实时后台语音监听服务
            - 中文语音指令意图识别
            - 文件管理（移动/复制/删除/搜索）
            - 媒体控制（播放/暂停/音量）
            - 系统设置切换（蓝牙/WiFi/手电筒等）
            - 无障碍服务辅助屏幕操控
            - 开机自启 + 自动更新检查
            - 全新深色紫蓝渐变 UI（Material 3）

            ### 安装说明
            下载 AURA-release.apk 安装到手机，首次启动需要授予录音、存储、通知等权限。
          files: |
            app/build/outputs/apk/release/*.apk
          prerelease: true
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
